# About Section
about_title: About Me
about_content: |
  I'm a Ph.D. student at KAIST focusing on systems research in operating systems and distributed systems.
  Research interest: Operating System, Distributed System, Consensus Protocol, Key-Value Store, Remote Direct Memory Access, Vector Database, Retrieval Augmented Generation.
  I have research and industry internship experience at Microsoft, Samsung, and core research labs, with publications in database systems and storage systems for modern datacenter workloads.

