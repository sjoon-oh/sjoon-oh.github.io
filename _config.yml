# About Section
about_title: About Me
about_content: |
  I'm a Ph.D. student at KAIST focusing on systems research in operating systems and distributed systems.
  Research interest: Operating System, Distributed System, Consensus Protocol, Key-Value Store, Remote Direct Memory Access, Vector Database, Retrieval Augmented Generation.
  I have research and industry internship experience at Microsoft, Samsung, and core research labs, with publications in database systems and storage systems for modern datacenter workloads.

content:
  - title: Education
    layout: list
    content:
      - layout: left
        title: KAIST
        sub_title: Ph.D Student, School of Electrical Engineering
        caption: Mar. 2024 – Current
        description: |
          My research focuses on efficient vector search and data-intensive systems. I study how caching and workload locality can reduce data movement across memory and storage hierarchies, with ongoing work extending these ideas to GPU-based vector search.

      - layout: left
        title: KAIST
        sub_title: M.S., School of Electrical Engineering
        caption: Mar. 2022 – Feb. 2024
        description: |
          I studied RDMA-based replication and distributed systems, focusing on reducing communication overhead in state machine replication. I also worked on scalable RDMA replication systems and integrated research prototypes into Redis and Memcached.

      - layout: left
        title: Yonsei University
        sub_title: B.S., School of Electrical and Electronic Engineering
        caption: Mar. 2020 – Feb. 2022
        description: |
          I built my foundation in operating systems, systems programming, and computer systems, and gained early research experience as an undergraduate research intern at Corelab.

      - layout: left
        title: Konkuk University
        sub_title: Certified, Department of Electronics Engineering
        caption: Mar. 2016 – Feb. 2020
        description: |
          Seoul, Korea
          Cumulative GPA: 4.26/4.50

  - title: Experience
    layout: list
    content:
      - layout: left
        title: Research Intern
        sub_title: Microsoft Canada
        caption: Mar. 2025 – Jun. 2025
        description: |
          I continued collaborative research on approximate caching for vector search. The work resulted in Aker, a cache integrated into PostgreSQL pgvector that improves both search efficiency and accuracy, and was published in PVLDB 2026.

      - layout: left
        title: Research Intern
        sub_title: Microsoft Research Asia
        caption: Sep. 2024 – Mar. 2025
        description: |
          I worked on optimization for vector search, studying the I/O behavior and read amplification of approximate nearest neighbor search. This work explored result reuse and approximate caching as a way to bypass expensive index traversals.

      - layout: left
        title: Undergraduate Research Intern
        sub_title: Corelab, Yonsei University
        caption: Jan. 2021 – Jun. 2021
        description: |
          Seoul, Korea

      - layout: left
        title: Operation Software Developer
        sub_title: Operation Information & Communication Group, ROKAF
        caption: Jul. 2017 – Jun. 2019
        description: |
          I developed operational software in C++ while serving in the Republic of Korea Air Force. Working with existing system constraints and validation requirements gave me early experience in building software where reliability and compatibility mattered as much as functionality.

  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: Development of Index Structure Optimized for Vector DB in CXL-based Storage System
        sub_title: Microsoft
        caption: Jun. 2024 – Jun. 2025
        description: |
          Research project on index structures for vector databases in CXL-based disaggregated storage systems.

      - layout: top-middle
        title: Disaggregated Memory Management for Hyperscale Datacenters
        sub_title: Samsung Electronics
        caption: Mar. 2022 – Mar. 2023
        description: |
          Project on memory management architecture and techniques for hyperscale datacenter environments.

  - title: Publications
    layout: list
    content:
      - layout: left
        title: "Aker: Density-Aware Approximate Caching for Vector Search"
        sub_title: VLDB Endowment, 19(10), 2026
        caption: 2026
        description: |
          Aker is an approximate result cache for disk-based vector search that adapts reuse decisions to individual queries and efficiently refreshes cached results under updates. Integrated into pgvector, Aker improves recall by up to 64 percentage points and QPS by up to 3.2× while using 0.6× the memory of PostgreSQL shared buffers.

