name: CI workflow

on:
  push:
    branches: [ master, resume ]
  pull_request:
    branches: [ master, resume ]

jobs:
  build-test:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.6
    - uses: actions/cache@v2
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-
    - name: Install dependencies
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
    - name: Build site
      run: |
        bundle exec jekyll build -d _site-ci

    - name: Run htmlproofer
      run: |
        bundle exec htmlproofer ./_site-ci --disable-external
